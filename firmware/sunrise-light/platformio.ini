; PlatformIO project for the Hardy Hub sunrise light — see ../README.md for
; the full step by step setup guide.
;
; The platform version is pinned deliberately: newer espressif32 releases
; (core 3.x) changed the ledc PWM API (ledcAttach/ledcWrite by pin instead of
; by channel). Pinning to a 6.x release keeps this project on the classic
; ledcSetup/ledcAttachPin/ledcWrite(channel, ...) API used in src/main.cpp.
; If you deliberately upgrade this, update the ledc calls in main.cpp too.

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21.5

build_flags =
    -D MQTT_MAX_PACKET_SIZE=1024
