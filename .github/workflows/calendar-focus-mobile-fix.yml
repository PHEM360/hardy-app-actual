name: Calendar Focus mobile fix build check

on:
  push:
    branches:
      - fix/calendar-focus-mobile-editor

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build web app
        run: npm run build
